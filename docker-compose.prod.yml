services:
  db:
    image: mysql:8.0
    container_name: tijerapp_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tijerapp_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tijerapp_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS_ORIGIN is not needed in the nginx same-origin setup.
      # Set it when the backend is deployed separately (e.g. Railway).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      REMINDER_WINDOW_HOURS: ${REMINDER_WINDOW_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tijerapp_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tijerapp_frontend_prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - tijerapp_prod

volumes:
  db_prod_data:

networks:
  tijerapp_prod:
    driver: bridge
