server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Proxy /api/ → backend (strips the /api prefix).
    # environment.prod.ts uses apiUrl: '/api', so the Angular app calls
    # /api/auth/login which nginx rewrites to http://backend:3000/auth/login.
    location /api/ {
        proxy_pass         http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for Socket.IO chat gateway (/chat namespace).
    # The socket.io-client connects to the origin root; Socket.IO uses
    # /socket.io/ as its default path, so we proxy that path preserving the
    # Upgrade / Connection headers required by the WS handshake.
    location /socket.io/ {
        proxy_pass         http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: always serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
